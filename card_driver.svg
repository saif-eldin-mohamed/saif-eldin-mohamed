<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Al-Fares Driver">
<defs>
  <filter id="gb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="cc"><rect width="600" height="340" rx="24"/></clipPath>
  <clipPath id="pc"><rect width="536" height="142" rx="16"/></clipPath>
  
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes dash{to{stroke-dashoffset:-28}}
  @keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2);opacity:0}}
  @keyframes hl{0%,22%{opacity:1}38%,100%{opacity:0}}
  @keyframes swa{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
  @keyframes swb{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes qh{0%{opacity:0}6%,28%{opacity:1}36%,100%{opacity:0}}
  @keyframes print{0%{transform:translateY(-86px)}60%,100%{transform:translateY(0)}}
  @keyframes bub{0%,28%{opacity:0;transform:translateY(10px)}44%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes prog{from{stroke-dashoffset:289}to{stroke-dashoffset:0}}
  .r1{animation:rise .8s .05s both ease-out}.r2{animation:rise .8s .2s both ease-out}.r3{animation:rise .8s .35s both ease-out}.r4{animation:rise .8s .5s both ease-out}
  .bob{animation:bob 4s ease-in-out infinite}
  .dash{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
  .ringa{transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
  .pl{animation:pulse 2s infinite}
</style>
<g clip-path="url(#cc)">
  <rect width="600" height="340" fill="#0A0C10"/>
  <circle cx="540" cy="40" r="95" fill="#7CF2C9" fill-opacity=".30" filter="url(#gb)"/>
  <circle cx="30" cy="330" r="80" fill="#7CF2C9" fill-opacity=".10" filter="url(#gb)"/>
  <g class="r1"><g><rect x="32.0" y="24" width="165.7" height="26" rx="13" fill="#7CF2C9" fill-opacity=".10" stroke="#7CF2C9" stroke-opacity=".55"/><text class="mono" x="46.0" y="41.5" font-size="11" letter-spacing="1.5" fill="#7CF2C9">03 / DELIVERY OPS</text></g><g><rect x="451.5" y="24" width="116.5" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="465.5" cy="37" r="3.5" fill="#9AA3B2"/><text class="mono" x="479.5" y="41.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">1K+ ON PLAY</text></g></g>
  <text class="serif r2" x="30" y="104" font-size="42" fill="#EDE8DD" letter-spacing="-1">Al-Fares Driver</text>
  <text class="mono r3" x="32" y="132" font-size="13.5" fill="#9AA3B2">Live driver tracking and order dispatch.</text>
  <text class="mono r3" x="32" y="152" font-size="13.5" fill="#9AA3B2">Keeps working when connectivity drops.</text>
  <g class="r4" transform="translate(32 170)">
    <rect width="536" height="142" rx="16" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".09"/>
    <g clip-path="url(#pc)"><g stroke="#fff" stroke-opacity=".05"><path d="M0 30H536M0 70H536M0 110H536M90 0V142M200 0V142M330 0V142M450 0V142"/></g>
<path id="rd" d="M34 104 C 110 30, 190 128, 270 74 S 430 22, 504 70" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="5" stroke-linecap="round"/>
<path class="dash" d="M34 104 C 110 30, 190 128, 270 74 S 430 22, 504 70" fill="none" stroke="#7CF2C9" stroke-width="3" stroke-linecap="round"/>
<circle cx="34" cy="104" r="8" fill="#0A0C10" stroke="#fff" stroke-width="2.5"/>
<rect x="496" y="62" width="16" height="16" rx="4" fill="#7CF2C9"/>
<circle r="14" fill="#7CF2C9" fill-opacity=".25"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#rd"/></animateMotion></circle>
<circle r="7" fill="#7CF2C9"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#rd"/></animateMotion></circle>
<g class="bob"><g transform="translate(176 10)"><g><rect x="0.0" y="0" width="95.5" height="26" rx="13" fill="#7CF2C9" fill-opacity=".10" stroke="#7CF2C9" stroke-opacity=".55"/><text class="mono" x="14.0" y="17.5" font-size="10" letter-spacing="1.5" fill="#7CF2C9">ETA 6 MIN</text></g></g></g>
<g transform="translate(330 106)"><g><rect x="0.0" y="0" width="124.0" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="14" cy="13" r="3.5" fill="#9AA3B2"/><text class="mono" x="28.0" y="17.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">OFFLINE SYNC</text></g></g></g>
  </g>
</g>
<rect x=".5" y=".5" width="599" height="339" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>