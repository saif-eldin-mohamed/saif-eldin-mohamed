<circle cx="104" cy="103" r="11" fill="#FF7A90"/><path d="M99 103H109M104 98V108" stroke="#0A0C10" stroke-width="2" stroke-linecap="round"/></g><circle r="5" fill="#FF7A90"><animateMotion dur="3.4s" begin="0.0s" repeatCount="indefinite" path="M104 103 Q 276 6 449 84"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.4s" begin="0.0s" repeatCount="indefinite"/></circle><g class="bob" style="animation-delay:0.6s"><rect x="138" y="16" width="104" height="110" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/>
<rect x="146" y="24" width="88" height="58" rx="9" fill="url(#g2)" fill-opacity=".9"/>
<rect x="146" y="92" width="54" height="8" rx="4" fill="#fff" fill-opacity=".3"/><rect x="146" y="107" width="34" height="6" rx="3" fill="#fff" fill-opacity=".14"/>
