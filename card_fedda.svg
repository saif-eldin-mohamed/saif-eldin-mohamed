  <circle cx="540" cy="40" r="95" fill="#FF7A90" fill-opacity=".30" filter="url(#gb)"/>
  <circle cx="30" cy="330" r="80" fill="#FF7A90" fill-opacity=".10" filter="url(#gb)"/>
  <g class="r1"><g><rect x="32.0" y="24" width="149.5" height="26" rx="13" fill="#FF7A90" fill-opacity=".10" stroke="#FF7A90" stroke-opacity=".55"/><text class="mono" x="46.0" y="41.5" font-size="11" letter-spacing="1.5" fill="#FF7A90">02 / E-COMMERCE</text></g><g><rect x="444.0" y="24" width="124.0" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="458.0" cy="37" r="3.5" fill="#9AA3B2"/><text class="mono" x="472.0" y="41.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">10K+ ON PLAY</text></g></g>
  <text class="serif r2" x="30" y="104" font-size="42" fill="#EDE8DD" letter-spacing="-1">Fedda</text>
  <text class="mono r3" x="32" y="132" font-size="13.5" fill="#9AA3B2">Cosmetics, jewelry and home appliances.</text>
  <text class="mono r3" x="32" y="152" font-size="13.5" fill="#9AA3B2">Auth, cart, payments, live order tracking.</text>
  <g transform="translate(32 170)"><g class="r4">
    <rect width="536" height="142" rx="16" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".09"/>
