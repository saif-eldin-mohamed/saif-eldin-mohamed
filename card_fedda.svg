<rect x="264" y="92" width="54" height="8" rx="4" fill="#fff" fill-opacity=".3"/><rect x="264" y="107" width="34" height="6" rx="3" fill="#fff" fill-opacity=".14"/>
<circle cx="340" cy="103" r="11" fill="#FF7A90"/><path d="M335 103H345M340 98V108" stroke="#0A0C10" stroke-width="2" stroke-linecap="round"/></g><circle r="5" fill="#FF7A90"><animateMotion dur="3.4s" begin="2.2s" repeatCount="indefinite" path="M340 103 Q 394 6 449 84"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.4s" begin="2.2s" repeatCount="indefinite"/></circle><rect x="410" y="52" width="78" height="66" rx="12" fill="#FF7A90" fill-opacity=".1" stroke="#FF7A90" stroke-width="2"/>
<path d="M432 52V46A17 17 0 0 1 466 46V52" fill="none" stroke="#FF7A90" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="488" cy="52" r="12" fill="#FF7A90"/><text class="mono" x="488" y="56.5" font-size="12" font-weight="700" text-anchor="middle" fill="#0A0C10">3</text>
<text class="mono" x="449" y="108" font-size="10" letter-spacing="2" text-anchor="middle" fill="#FF7A90">CART</text></g>
  </g></g>
