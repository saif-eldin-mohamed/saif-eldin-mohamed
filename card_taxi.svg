<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Taxi Beirut">
<defs>
  <filter id="gb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="cc"><rect width="600" height="340" rx="24"/></clipPath>
  <clipPath id="pc"><rect width="536" height="142" rx="16"/></clipPath>
  <pattern id="mg" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes dash{to{stroke-dashoffset:-28}}
  @keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2);opacity:0}}
  @keyframes hl{0%,22%{opacity:1}38%,100%{opacity:0}}
  @keyframes swa{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
  @keyframes swb{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes qh{0%{opacity:0}6%,28%{opacity:1}36%,100%{opacity:0}}
  @keyframes print{0%{transform:translateY(-86px)}60%,100%{transform:translateY(0)}}
  @keyframes bub{0%,28%{opacity:0;transform:translateY(10px)}44%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes prog{from{stroke-dashoffset:289}to{stroke-dashoffset:0}}
  .r1{animation:rise .8s .05s both ease-out}.r2{animation:rise .8s .2s both ease-out}.r3{animation:rise .8s .35s both ease-out}.r4{animation:rise .8s .5s both ease-out}
  .bob{animation:bob 4s ease-in-out infinite}
  .dash{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
  .ringa{transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
  .pl{animation:pulse 2s infinite}
</style>
<g clip-path="url(#cc)">
  <rect width="600" height="340" fill="#0A0C10"/>
  <circle cx="540" cy="40" r="95" fill="#5EC8FF" fill-opacity=".30" filter="url(#gb)"/>
  <circle cx="30" cy="330" r="80" fill="#5EC8FF" fill-opacity=".10" filter="url(#gb)"/>
  <g class="r1"><g><rect x="32.0" y="24" width="165.7" height="26" rx="13" fill="#5EC8FF" fill-opacity=".10" stroke="#5EC8FF" stroke-opacity=".55"/><text class="mono" x="46.0" y="41.5" font-size="11" letter-spacing="1.5" fill="#5EC8FF">05 / RIDE-HAILING</text></g><g><rect x="429.0" y="24" width="139.0" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="443.0" cy="37" r="3.5" fill="#9AA3B2"/><text class="mono" x="457.0" y="41.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">LIVE DASHBOARD</text></g></g>
  <text class="serif r2" x="30" y="104" font-size="42" fill="#EDE8DD" letter-spacing="-1">Taxi Beirut</text>
  <text class="mono r3" x="32" y="132" font-size="13.5" fill="#9AA3B2">Real-time ride tracking, dispatch</text>
  <text class="mono r3" x="32" y="152" font-size="13.5" fill="#9AA3B2">and fleet management over WebSockets.</text>
  <g class="r4" transform="translate(32 170)">
    <rect width="536" height="142" rx="16" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".09"/>
    <g clip-path="url(#pc)"><rect width="536" height="142" fill="url(#mg)"/>
<g fill="#fff" fill-opacity=".05"><rect y="34" width="536" height="10"/><rect y="92" width="536" height="10"/><rect x="150" width="10" height="142"/><rect x="370" width="10" height="142"/></g>
<circle r="11" fill="#5EC8FF" fill-opacity=".22"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M0 39 H536"/></circle><circle r="5" fill="#5EC8FF"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M0 39 H536"/></circle><circle r="11" fill="#5EC8FF" fill-opacity=".22"><animateMotion dur="9s" begin="0s" repeatCount="indefinite" path="M536 97 H0"/></circle><circle r="5" fill="#5EC8FF"><animateMotion dur="9s" begin="0s" repeatCount="indefinite" path="M536 97 H0"/></circle><circle r="11" fill="#5EC8FF" fill-opacity=".22"><animateMotion dur="6s" begin="1s" repeatCount="indefinite" path="M155 0 V142"/></circle><circle r="5" fill="#5EC8FF"><animateMotion dur="6s" begin="1s" repeatCount="indefinite" path="M155 0 V142"/></circle><circle r="11" fill="#5EC8FF" fill-opacity=".22"><animateMotion dur="8s" begin="2s" repeatCount="indefinite" path="M375 142 V0"/></circle><circle r="5" fill="#5EC8FF"><animateMotion dur="8s" begin="2s" repeatCount="indefinite" path="M375 142 V0"/></circle><circle r="11" fill="#5EC8FF" fill-opacity=".22"><animateMotion dur="10s" begin="3s" repeatCount="indefinite" path="M0 97 H375 V0"/></circle><circle r="5" fill="#5EC8FF"><animateMotion dur="10s" begin="3s" repeatCount="indefinite" path="M0 97 H375 V0"/></circle>
<circle class="ringa" cx="262" cy="68" r="12" fill="none" stroke="#FFB547" stroke-width="2"/>
<circle cx="262" cy="68" r="5.5" fill="#FFB547"/>
<g transform="translate(274 52)"><g><rect x="0.0" y="0" width="88.0" height="26" rx="13" fill="#FFB547" fill-opacity=".10" stroke="#FFB547" stroke-opacity=".55"/><text class="mono" x="14.0" y="17.5" font-size="10" letter-spacing="1.5" fill="#FFB547">NEW RIDE</text></g></g>
<g transform="translate(12 10)"><g><rect x="0.0" y="0" width="154.0" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="14" cy="13" r="3.5" fill="#9AA3B2"/><text class="mono" x="28.0" y="17.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">4 DRIVERS ONLINE</text></g></g></g>
  </g>
</g>
<rect x=".5" y=".5" width="599" height="339" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>