<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Al-Fares Merchant">
<defs>
  <filter id="gb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="cc"><rect width="600" height="340" rx="24"/></clipPath>
  <clipPath id="pc"><rect width="536" height="142" rx="16"/></clipPath>
  
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes dash{to{stroke-dashoffset:-28}}
  @keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2);opacity:0}}
  @keyframes hl{0%,22%{opacity:1}38%,100%{opacity:0}}
  @keyframes swa{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
  @keyframes swb{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes qh{0%{opacity:0}6%,28%{opacity:1}36%,100%{opacity:0}}
  @keyframes print{0%{transform:translateY(-86px)}60%,100%{transform:translateY(0)}}
  @keyframes bub{0%,28%{opacity:0;transform:translateY(10px)}44%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes prog{from{stroke-dashoffset:289}to{stroke-dashoffset:0}}
  .r1{animation:rise .8s .05s both ease-out}.r2{animation:rise .8s .2s both ease-out}.r3{animation:rise .8s .35s both ease-out}.r4{animation:rise .8s .5s both ease-out}
  .bob{animation:bob 4s ease-in-out infinite}
  .dash{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
  .ringa{transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
  .pl{animation:pulse 2s infinite}
</style>
<g clip-path="url(#cc)">
  <rect width="600" height="340" fill="#0A0C10"/>
  <circle cx="540" cy="40" r="95" fill="#8B7CFF" fill-opacity=".30" filter="url(#gb)"/>
  <circle cx="30" cy="330" r="80" fill="#8B7CFF" fill-opacity=".10" filter="url(#gb)"/>
  <g class="r1"><g><rect x="32.0" y="24" width="206.2" height="26" rx="13" fill="#8B7CFF" fill-opacity=".10" stroke="#8B7CFF" stroke-opacity=".55"/><text class="mono" x="46.0" y="41.5" font-size="11" letter-spacing="1.5" fill="#8B7CFF">04 / DELIVERY REQUESTS</text></g><g><rect x="451.5" y="24" width="116.5" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="465.5" cy="37" r="3.5" fill="#9AA3B2"/><text class="mono" x="479.5" y="41.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">1K+ ON PLAY</text></g></g>
  <text class="serif r2" x="30" y="104" font-size="42" fill="#EDE8DD" letter-spacing="-1">Al-Fares Merchant</text>
  <text class="mono r3" x="32" y="132" font-size="13.5" fill="#9AA3B2">Merchants create delivery requests,</text>
  <text class="mono r3" x="32" y="152" font-size="13.5" fill="#9AA3B2">track them, and hand off to drivers.</text>
  <g transform="translate(32 170)"><g class="r4">
    <rect width="536" height="142" rx="16" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".09"/>
    <g clip-path="url(#pc)"><rect x="20" y="12" width="262" height="34" rx="11" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".08"/>
<circle cx="40" cy="29" r="8" fill="#fff" fill-opacity=".14"/><rect x="56" y="21" width="92" height="6" rx="3" fill="#fff" fill-opacity=".3"/><rect x="56" y="32" width="58" height="5" rx="2.5" fill="#fff" fill-opacity=".14"/><rect x="20" y="54" width="262" height="34" rx="11" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".08"/>
<circle cx="40" cy="71" r="8" fill="#fff" fill-opacity=".14"/><rect x="56" y="63" width="92" height="6" rx="3" fill="#fff" fill-opacity=".3"/><rect x="56" y="74" width="58" height="5" rx="2.5" fill="#fff" fill-opacity=".14"/><rect x="20" y="96" width="262" height="34" rx="11" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".08"/>
<circle cx="40" cy="113" r="8" fill="#fff" fill-opacity=".14"/><rect x="56" y="105" width="92" height="6" rx="3" fill="#fff" fill-opacity=".3"/><rect x="56" y="116" width="58" height="5" rx="2.5" fill="#fff" fill-opacity=".14"/><g style="animation:swa 5s infinite"><g><rect x="202" y="19" width="72" height="20" rx="10" fill="#FFB547" fill-opacity=".18" stroke="#FFB547" stroke-opacity=".6"/><text class="mono" x="238" y="33" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1" fill="#FFB547">NEW</text></g></g><g style="animation:swb 5s infinite"><g><rect x="202" y="19" width="72" height="20" rx="10" fill="#8B7CFF" fill-opacity=".18" stroke="#8B7CFF" stroke-opacity=".6"/><text class="mono" x="238" y="33" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1" fill="#8B7CFF">ASSIGNED</text></g></g><g><rect x="202" y="61" width="72" height="20" rx="10" fill="#8B7CFF" fill-opacity=".18" stroke="#8B7CFF" stroke-opacity=".6"/><text class="mono" x="238" y="75" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1" fill="#8B7CFF">ASSIGNED</text></g><g><rect x="202" y="103" width="72" height="20" rx="10" fill="#34D399" fill-opacity=".18" stroke="#34D399" stroke-opacity=".6"/><text class="mono" x="238" y="117" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1" fill="#34D399">DONE</text></g><path id="hp" d="M284 29 C 340 29, 350 71, 402 71" fill="none" stroke="#8B7CFF" stroke-width="2.5" class="dash"/>
<circle r="5" fill="#8B7CFF"><animateMotion dur="2.6s" repeatCount="indefinite" path="M284 29 C 340 29, 350 71, 402 71"/></circle>
<circle cx="440" cy="71" r="32" fill="#8B7CFF" fill-opacity=".12" stroke="#8B7CFF" stroke-width="2"/>
<circle cx="440" cy="62" r="8.5" fill="#8B7CFF"/><path d="M423 92a17 14 0 0 1 34 0z" fill="#8B7CFF"/>
<text class="mono" x="440" y="124" font-size="10" letter-spacing="2" text-anchor="middle" fill="#9AA3B2">DRIVER</text>
<circle class="ringa" cx="440" cy="71" r="32" fill="none" stroke="#8B7CFF" stroke-width="2"/></g>
  </g></g>
</g>
<rect x=".5" y=".5" width="599" height="339" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>