<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Timeline: El Magd MTS 2023, Freelance 2024, Iraq Soft 2024-2025, Collard 2025 to now" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1140" y2="0"><stop offset="0" stop-color="#EDE8DD" stop-opacity=".25"/><stop offset="1" stop-color="#F5A524"/></linearGradient></defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}
  .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s .2s forwards ease-out}
  .n{animation:rise .8s both ease-out}
  .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
</style>
<rect width="1200" height="320" rx="22" fill="#0A0C10"/>
<rect x=".5" y=".5" width="1199" height="319" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/>
<path class="ln" pathLength="1" d="M60 130H1140" stroke="url(#ln)" stroke-width="2" fill="none"/>
<g class="n" style="animation-delay:0.5s">
  <text class="mono" x="150" y="92" font-size="12" letter-spacing="2" text-anchor="middle" fill="#9AA3B2">SEP 2023 – MAR 2024</text>
  
  <circle cx="150" cy="130" r="8" fill="#0A0C10" stroke="#EDE8DD" stroke-width="2"/>
  <text class="serif" x="150" y="190" font-size="30" text-anchor="middle" fill="#EDE8DD" >El Magd MTS</text>
  <text class="mono" x="150" y="216" font-size="12.5" text-anchor="middle" fill="#9AA3B2">POS app: manual to digital</text>
  <text class="mono" x="150" y="236" font-size="12.5" text-anchor="middle" fill="#5B6472">ESC/POS and TSPL printing</text>
</g><g class="n" style="animation-delay:0.85s">
  <text class="mono" x="430" y="92" font-size="12" letter-spacing="2" text-anchor="middle" fill="#9AA3B2">APR – OCT 2024</text>
  
  <circle cx="430" cy="130" r="8" fill="#0A0C10" stroke="#EDE8DD" stroke-width="2"/>
  <text class="serif" x="430" y="190" font-size="30" text-anchor="middle" fill="#EDE8DD" >Freelance</text>
  <text class="mono" x="430" y="216" font-size="12.5" text-anchor="middle" fill="#9AA3B2">3 apps, 3 clients, 6 months</text>
  <text class="mono" x="430" y="236" font-size="12.5" text-anchor="middle" fill="#5B6472">OAuth/JWT, WebSockets, CI/CD</text>
</g><g class="n" style="animation-delay:1.2s">
  <text class="mono" x="710" y="92" font-size="12" letter-spacing="2" text-anchor="middle" fill="#9AA3B2">OCT 2024 – JUL 2025</text>
  
  <circle cx="710" cy="130" r="8" fill="#0A0C10" stroke="#EDE8DD" stroke-width="2"/>
  <text class="serif" x="710" y="190" font-size="30" text-anchor="middle" fill="#EDE8DD" >Iraq Soft</text>
  <text class="mono" x="710" y="216" font-size="12.5" text-anchor="middle" fill="#9AA3B2">4 products in 9 months</text>
  <text class="mono" x="710" y="236" font-size="12.5" text-anchor="middle" fill="#5B6472">Tracking, dispatch, offline-first</text>
</g><g class="n" style="animation-delay:1.5499999999999998s">
  <text class="mono" x="990" y="92" font-size="12" letter-spacing="2" text-anchor="middle" fill="#F5A524">JUL 2025 – NOW</text>
  <circle class="ring" cx="990" cy="130" r="14" fill="none" stroke="#F5A524" stroke-width="2"/>
  <circle cx="990" cy="130" r="8" fill="#F5A524" stroke="#F5A524" stroke-width="2"/>
  <text class="serif" x="990" y="190" font-size="30" text-anchor="middle" fill="#F5A524" font-style="italic">Collard</text>
  <text class="mono" x="990" y="216" font-size="12.5" text-anchor="middle" fill="#9AA3B2">Sole Flutter developer</text>
  <text class="mono" x="990" y="236" font-size="12.5" text-anchor="middle" fill="#5B6472">Payments, native, releases</text>
</g>
<text class="mono" x="600" y="290" font-size="11.5" letter-spacing="3" text-anchor="middle" fill="#5B6472">B.SC. COMPUTER SCIENCE  /  OBOUR UNIVERSITY  /  2020 – 2024</text>
</svg>