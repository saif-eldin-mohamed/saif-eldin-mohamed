<circle cx="80" cy="103" r="5" fill="#F5A524"/><circle cx="96" cy="103" r="5" fill="#FF7A90"/><circle cx="112" cy="103" r="5" fill="#8B7CFF"/>
<rect x="20" y="12" width="112" height="118" rx="14" fill="none" stroke="#F5A524" stroke-width="2" style="animation:hl 5s 0.0s infinite;opacity:0"/></g><g class="bob" style="animation-delay:0.5s"><rect x="144" y="12" width="112" height="118" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/>
<rect x="152" y="20" width="96" height="58" rx="9" fill="url(#b1)" fill-opacity=".9"/>
<rect x="152" y="86" width="64" height="7" rx="3.5" fill="#fff" fill-opacity=".3"/><rect x="152" y="99" width="36" height="8" rx="4" fill="#F5A524"/>
<circle cx="204" cy="103" r="5" fill="#F5A524"/><circle cx="220" cy="103" r="5" fill="#FF7A90"/><circle cx="236" cy="103" r="5" fill="#8B7CFF"/>
<rect x="144" y="12" width="112" height="118" rx="14" fill="none" stroke="#F5A524" stroke-width="2" style="animation:hl 5s 1.25s infinite;opacity:0"/></g><g class="bob" style="animation-delay:1.0s"><rect x="268" y="12" width="112" height="118" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/>
<rect x="276" y="20" width="96" height="58" rx="9" fill="url(#b2)" fill-opacity=".9"/>
<rect x="276" y="86" width="64" height="7" rx="3.5" fill="#fff" fill-opacity=".3"/><rect x="276" y="99" width="36" height="8" rx="4" fill="#F5A524"/>
<circle cx="328" cy="103" r="5" fill="#F5A524"/><circle cx="344" cy="103" r="5" fill="#FF7A90"/><circle cx="360" cy="103" r="5" fill="#8B7CFF"/>
<rect x="268" y="12" width="112" height="118" rx="14" fill="none" stroke="#F5A524" stroke-width="2" style="animation:hl 5s 2.5s infinite;opacity:0"/></g><g class="bob" style="animation-delay:1.5s"><rect x="392" y="12" width="112" height="118" rx="14" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".1"/>
<rect x="400" y="20" width="96" height="58" rx="9" fill="url(#b3)" fill-opacity=".9"/>
