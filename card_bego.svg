<circle cx="452" cy="103" r="5" fill="#F5A524"/><circle cx="468" cy="103" r="5" fill="#FF7A90"/><circle cx="484" cy="103" r="5" fill="#8B7CFF"/>
<rect x="392" y="12" width="112" height="118" rx="14" fill="none" stroke="#F5A524" stroke-width="2" style="animation:hl 5s 3.75s infinite;opacity:0"/></g><g class="pl"><rect x="206" y="24" width="38" height="18" rx="9" fill="#FF7A90"/><text class="mono" x="225" y="37" font-size="10" font-weight="700" text-anchor="middle" fill="#0A0C10">-20%</text></g></g>
  </g></g>
</g>
<rect x=".5" y=".5" width="599" height="339" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
