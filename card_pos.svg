<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="POS App">
<defs>
  <filter id="gb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="cc"><rect width="600" height="340" rx="24"/></clipPath>
  <clipPath id="pc"><rect width="536" height="142" rx="16"/></clipPath>
  <clipPath id="rc"><rect x="40" y="64" width="184" height="80"/></clipPath>
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes dash{to{stroke-dashoffset:-28}}
  @keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2);opacity:0}}
  @keyframes hl{0%,22%{opacity:1}38%,100%{opacity:0}}
  @keyframes swa{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
  @keyframes swb{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes qh{0%{opacity:0}6%,28%{opacity:1}36%,100%{opacity:0}}
  @keyframes print{0%{transform:translateY(-86px)}60%,100%{transform:translateY(0)}}
  @keyframes bub{0%,28%{opacity:0;transform:translateY(10px)}44%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes prog{from{stroke-dashoffset:289}to{stroke-dashoffset:0}}
  .r1{animation:rise .8s .05s both ease-out}.r2{animation:rise .8s .2s both ease-out}.r3{animation:rise .8s .35s both ease-out}.r4{animation:rise .8s .5s both ease-out}
  .bob{animation:bob 4s ease-in-out infinite}
  .dash{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
  .ringa{transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
  .pl{animation:pulse 2s infinite}
</style>
<g clip-path="url(#cc)">
  <rect width="600" height="340" fill="#0A0C10"/>
  <circle cx="540" cy="40" r="95" fill="#FB923C" fill-opacity=".30" filter="url(#gb)"/>
  <circle cx="30" cy="330" r="80" fill="#FB923C" fill-opacity=".10" filter="url(#gb)"/>
  <g class="r1"><g><rect x="32.0" y="24" width="173.8" height="26" rx="13" fill="#FB923C" fill-opacity=".10" stroke="#FB923C" stroke-opacity=".55"/><text class="mono" x="46.0" y="41.5" font-size="11" letter-spacing="1.5" fill="#FB923C">09 / POINT OF SALE</text></g><g><rect x="429.0" y="24" width="139.0" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="443.0" cy="37" r="3.5" fill="#9AA3B2"/><text class="mono" x="457.0" y="41.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">ESC/POS + TSPL</text></g></g>
  <text class="serif r2" x="30" y="104" font-size="42" fill="#EDE8DD" letter-spacing="-1">POS App</text>
  <text class="mono r3" x="32" y="132" font-size="13.5" fill="#9AA3B2">Sales tracking and receipt printing</text>
  <text class="mono r3" x="32" y="152" font-size="13.5" fill="#9AA3B2">over Bluetooth, Wi-Fi and USB.</text>
  <g class="r4" transform="translate(32 170)">
    <rect width="536" height="142" rx="16" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".09"/>
    <g clip-path="url(#pc)"><rect x="28" y="14" width="208" height="50" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".14"/>
<circle class="pl" cx="50" cy="39" r="4.5" fill="#FB923C"/><rect x="66" y="31" width="100" height="6" rx="3" fill="#fff" fill-opacity=".25"/><rect x="66" y="43" width="64" height="5" rx="2.5" fill="#fff" fill-opacity=".12"/>
<g clip-path="url(#rc)"><g style="animation:print 6s ease-out infinite">
<rect x="56" y="58" width="152" height="130" rx="4" fill="#EDE8DD"/>
<rect x="100" y="66" width="64" height="5" rx="2.5" fill="#0A0C10" fill-opacity=".7"/>
<rect x="72" y="74" width="62" height="5" rx="2.5" fill="#0A0C10" fill-opacity=".55"/><rect x="170" y="74" width="26" height="5" rx="2.5" fill="#0A0C10" fill-opacity=".35"/><rect x="72" y="87" width="48" height="5" rx="2.5" fill="#0A0C10" fill-opacity=".55"/><rect x="170" y="87" width="26" height="5" rx="2.5" fill="#0A0C10" fill-opacity=".35"/><rect x="72" y="100" width="70" height="5" rx="2.5" fill="#0A0C10" fill-opacity=".55"/><rect x="170" y="100" width="26" height="5" rx="2.5" fill="#0A0C10" fill-opacity=".35"/><rect x="72" y="113" width="40" height="5" rx="2.5" fill="#0A0C10" fill-opacity=".55"/><rect x="170" y="113" width="26" height="5" rx="2.5" fill="#0A0C10" fill-opacity=".35"/>
<path d="M68 128H196" stroke="#0A0C10" stroke-opacity=".3" stroke-dasharray="3 3"/><rect x="72" y="136" width="48" height="8" rx="4" fill="#FB923C"/><rect x="156" y="136" width="40" height="8" rx="4" fill="#0A0C10" fill-opacity=".7"/>
</g></g>
<rect x="44" y="58" width="176" height="7" rx="3.5" fill="#000" fill-opacity=".7"/>
<g transform="translate(290 12)"><g><rect x="0.0" y="0" width="101.5" height="26" rx="13" fill="#FB923C" fill-opacity=".10" stroke="#FB923C" stroke-opacity=".55"/><circle class="pl" cx="14" cy="13" r="3.5" fill="#FB923C"/><text class="mono" x="28.0" y="17.5" font-size="10" letter-spacing="1.5" fill="#FB923C">BLUETOOTH</text></g><g><rect x="0.0" y="34" width="71.5" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="14" cy="47" r="3.5" fill="#9AA3B2"/><text class="mono" x="28.0" y="51.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">WI-FI</text></g><g><rect x="0.0" y="68" width="56.5" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="14" cy="81" r="3.5" fill="#9AA3B2"/><text class="mono" x="28.0" y="85.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">USB</text></g></g>
<g style="animation:bub 6s infinite;opacity:0"><rect x="410" y="52" width="114" height="48" rx="13" fill="#34D399" fill-opacity=".16" stroke="#34D399"/>
<path d="M416 100L408 112L428 100z" fill="#34D399" fill-opacity=".5"/>
<text class="mono" x="424" y="72" font-size="10.5" fill="#EDE8DD">Receipt sent</text><text class="mono" x="424" y="88" font-size="9" letter-spacing="1" fill="#34D399">WHATSAPP</text>
<path d="M494 68l4 4l8-9M504 68l4 4l8-9" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  </g>
</g>
<rect x=".5" y=".5" width="599" height="339" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>