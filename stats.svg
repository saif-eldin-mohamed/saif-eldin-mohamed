<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="3+ years, 6 apps live, 10 store listings, 14K+ downloads" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .n{animation:rise .8s both ease-out}
</style>
<rect width="1200" height="150" rx="22" fill="#0A0C10"/>
<rect x=".5" y=".5" width="1199" height="149" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/>
<g stroke="#fff" stroke-opacity=".08"><path d="M300 30V120"/><path d="M600 30V120"/><path d="M900 30V120"/></g>
<g text-anchor="middle">
  <g class="n" style="animation-delay:.1s"><text class="serif" x="150" y="84" font-size="56" fill="#EDE8DD">3<tspan fill="#F5A524">+</tspan></text><text class="mono" x="150" y="112" font-size="11" letter-spacing="3" fill="#9AA3B2">YEARS IN PRODUCTION</text></g>
  <g class="n" style="animation-delay:.25s"><text class="serif" x="450" y="84" font-size="56" fill="#EDE8DD">6</text><text class="mono" x="450" y="112" font-size="11" letter-spacing="3" fill="#9AA3B2">APPS LIVE IN STORES</text></g>
  <g class="n" style="animation-delay:.4s"><text class="serif" x="750" y="84" font-size="56" fill="#EDE8DD">10</text><text class="mono" x="750" y="112" font-size="11" letter-spacing="3" fill="#9AA3B2">STORE LISTINGS</text></g>
  <g class="n" style="animation-delay:.55s"><text class="serif" x="1050" y="84" font-size="56" fill="#EDE8DD">14K<tspan fill="#F5A524">+</tspan></text><text class="mono" x="1050" y="112" font-size="11" letter-spacing="3" fill="#9AA3B2">GOOGLE PLAY DOWNLOADS</text></g>
</g>
</svg>
