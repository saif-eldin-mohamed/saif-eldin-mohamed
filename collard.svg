      <text class="mono" x="26" y="42" font-size="11" letter-spacing="3" fill="#0A0C10" fill-opacity=".7">COLLARD  /  LIVE</text>
      <text class="serif" x="24" y="110" font-size="46" fill="#0A0C10" letter-spacing="-1">Admit</text>
      <text class="serif" x="24" y="156" font-size="46" font-style="italic" fill="#0A0C10" letter-spacing="-1">One</text>
