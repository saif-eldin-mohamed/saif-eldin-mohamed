      <text class="mono" x="26" y="220" font-size="11" fill="#0A0C10" fill-opacity=".55" letter-spacing="2">MULTI-DAY PASS</text>
      <g fill="#0A0C10"><rect x="238" y="84" width="9.5" height="9.5" rx="1.5"/><rect x="238" y="95" width="9.5" height="9.5" rx="1.5"/><rect x="238" y="106" width="9.5" height="9.5" rx="1.5"/><rect x="238" y="117" width="9.5" height="9.5" rx="1.5"/><rect x="238" y="128" width="9.5" height="9.5" rx="1.5"/><rect x="238" y="139" width="9.5" height="9.5" rx="1.5"/><rect x="238" y="150" width="9.5" height="9.5" rx="1.5"/><rect x="249" y="84" width="9.5" height="9.5" rx="1.5"/><rect x="249" y="106" width="9.5" height="9.5" rx="1.5"/><rect x="249" y="117" width="9.5" height="9.5" rx="1.5"/><rect x="249" y="128" width="9.5" height="9.5" rx="1.5"/><rect x="249" y="150" width="9.5" height="9.5" rx="1.5"/><rect x="260" y="84" width="9.5" height="9.5" rx="1.5"/><rect x="260" y="95" width="9.5" height="9.5" rx="1.5"/><rect x="260" y="106" width="9.5" height="9.5" rx="1.5"/><rect x="260" y="128" width="9.5" height="9.5" rx="1.5"/><rect x="260" y="139" width="9.5" height="9.5" rx="1.5"/><rect x="260" y="150" width="9.5" height="9.5" rx="1.5"/><rect x="271" y="84" width="9.5" height="9.5" rx="1.5"/><rect x="271" y="106" width="9.5" height="9.5" rx="1.5"/><rect x="271" y="117" width="9.5" height="9.5" rx="1.5"/><rect x="271" y="139" width="9.5" height="9.5" rx="1.5"/><rect x="271" y="150" width="9.5" height="9.5" rx="1.5"/><rect x="282" y="84" width="9.5" height="9.5" rx="1.5"/><rect x="282" y="95" width="9.5" height="9.5" rx="1.5"/><rect x="282" y="106" width="9.5" height="9.5" rx="1.5"/><rect x="282" y="117" width="9.5" height="9.5" rx="1.5"/><rect x="282" y="128" width="9.5" height="9.5" rx="1.5"/><rect x="282" y="139" width="9.5" height="9.5" rx="1.5"/><rect x="293" y="84" width="9.5" height="9.5" rx="1.5"/><rect x="293" y="106" width="9.5" height="9.5" rx="1.5"/><rect x="293" y="117" width="9.5" height="9.5" rx="1.5"/><rect x="293" y="128" width="9.5" height="9.5" rx="1.5"/><rect x="304" y="84" width="9.5" height="9.5" rx="1.5"/><rect x="304" y="95" width="9.5" height="9.5" rx="1.5"/><rect x="304" y="106" width="9.5" height="9.5" rx="1.5"/><rect x="304" y="128" width="9.5" height="9.5" rx="1.5"/><rect x="304" y="150" width="9.5" height="9.5" rx="1.5"/></g>
      <text class="mono" x="276" y="182" font-size="9" text-anchor="middle" letter-spacing="2" fill="#0A0C10" fill-opacity=".7">SCAN</text>
      <rect x="-200" y="-20" width="120" height="300" fill="url(#sw)" transform="rotate(18)">
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;640 0" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <circle cx="232" cy="0" r="13" fill="#0A0C10"/><circle cx="232" cy="250" r="13" fill="#0A0C10"/>
    <g class="st"><g transform="translate(166 150) rotate(-14)"><rect x="-44" y="-18" width="88" height="36" rx="6" fill="none" stroke="#0B6B4F" stroke-width="3"/><text class="mono" x="0" y="6" font-size="18" font-weight="700" text-anchor="middle" fill="#0B6B4F" letter-spacing="3">PAID</text></g></g>
  </g></g>
