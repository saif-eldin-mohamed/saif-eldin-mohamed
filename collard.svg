<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Collard, event ticketing and payments app" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
  <linearGradient id="tk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC25A"/><stop offset="1" stop-color="#E8871E"/></linearGradient>
  <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect width="1200" height="380" rx="26"/></clipPath>
  <clipPath id="tkc"><rect width="320" height="250" rx="22"/></clipPath>
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes stamp{0%,22%{opacity:0;transform:scale(1.8)}34%,80%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(1)}}
  .t{animation:bob 6s ease-in-out infinite}
  .st{transform-box:fill-box;transform-origin:center;animation:stamp 6s infinite}
  .r1{animation:rise .8s .1s both ease-out}.r2{animation:rise .8s .25s both ease-out}.r3{animation:rise .8s .4s both ease-out}.r4{animation:rise .8s .55s both ease-out}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="380" fill="#0A0C10"/>
  <g filter="url(#b)"><circle cx="1000" cy="190" r="170" fill="#F5A524" fill-opacity=".28"/><circle cx="80" cy="360" r="130" fill="#8B7CFF" fill-opacity=".16"/></g>
  <g class="r1"><rect x="64" y="52" width="150" height="26" rx="13" fill="#F5A524" fill-opacity=".14" stroke="#F5A524" stroke-opacity=".5"/><text class="mono" x="80" y="69" font-size="11" letter-spacing="2" fill="#F5A524">FLAGSHIP  /  2025</text></g>
  <text class="serif r2" x="60" y="166" font-size="92" fill="#EDE8DD" letter-spacing="-2">Collard</text>
  <text class="mono r3" x="64" y="204" font-size="15" fill="#9AA3B2">Event ticketing and payments. Sole Flutter developer,</text>
  <text class="mono r3" x="64" y="226" font-size="15" fill="#9AA3B2">architecture to store release.</text>
  <g class="r4">
    <g><rect x="64" y="254" width="158" height="30" rx="15" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text class="mono" x="78" y="274" font-size="12" fill="#EDE8DD">Clean Architecture</text></g><g><rect x="232" y="254" width="57" height="30" rx="15" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text class="mono" x="246" y="274" font-size="12" fill="#EDE8DD">BLoC</text></g><g><rect x="299" y="254" width="57" height="30" rx="15" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text class="mono" x="313" y="274" font-size="12" fill="#EDE8DD">Hive</text></g><g><rect x="366" y="254" width="86" height="30" rx="15" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text class="mono" x="380" y="274" font-size="12" fill="#EDE8DD">Seats.io</text></g>
    <g><rect x="64" y="294" width="71" height="30" rx="15" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text class="mono" x="78" y="314" font-size="12" fill="#EDE8DD">Paymob</text></g><g><rect x="145" y="294" width="114" height="30" rx="15" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".14"/><text class="mono" x="159" y="314" font-size="12" fill="#EDE8DD">Kotlin/Swift</text></g>
  </g>
  <text class="mono r4" x="64" y="354" font-size="12" fill="#5B6472" letter-spacing="1">1K+ DOWNLOADS  /  GOOGLE PLAY + APP STORE</text>

  <g transform="translate(790 64) rotate(-4)"><g class="t">
    <g clip-path="url(#tkc)">
