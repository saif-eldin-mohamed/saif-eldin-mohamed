<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Saif Eldeen Mohamed, Flutter engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  <radialGradient id="glow" cx="78%" cy="25%" r="55%"><stop offset="0" stop-color="#F5A524" stop-opacity=".30"/><stop offset="1" stop-color="#F5A524" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="95%" cy="100%" r="40%"><stop offset="0" stop-color="#7CF2C9" stop-opacity=".16"/><stop offset="1" stop-color="#7CF2C9" stop-opacity="0"/></radialGradient>
  <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D222D"/><stop offset="1" stop-color="#0F1218"/></linearGradient>
  <clipPath id="r"><rect width="1200" height="440" rx="26"/></clipPath>
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes bob2{0%,100%{transform:translateY(-8px)}50%{transform:translateY(8px)}}
  @keyframes dash{to{stroke-dashoffset:-48}}
  @keyframes seat{0%,100%{fill:#fff;fill-opacity:.14}40%,75%{fill:#F5A524;fill-opacity:1}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .a1{animation:rise .9s .1s both ease-out}
  .a2{animation:rise .9s .3s both ease-out}
  .a3{animation:rise .9s .5s both ease-out}
  .a4{animation:rise .9s .7s both ease-out}
  .a5{animation:rise .9s .9s both ease-out}
  .line{transform-origin:64px 0;animation:grow 1s .6s both ease-out}
  .dot{animation:pulse 2s infinite}
  .f1{animation:bob 6s ease-in-out infinite}
  .f2{animation:bob2 7s ease-in-out infinite}
  .s{fill:#fff;fill-opacity:.14;animation:seat 4.8s infinite}
  .route{stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
</style>
<g clip-path="url(#r)">
  <rect width="1200" height="440" fill="#0A0C10"/>
  <rect width="1200" height="440" fill="url(#grid)"/>
  <rect width="1200" height="440" fill="url(#glow)"/>
  <rect width="1200" height="440" fill="url(#glow2)"/>

  <g class="a1">
    <circle class="dot" cx="68" cy="68" r="5" fill="#7CF2C9"/>
    <text class="mono" x="86" y="73" font-size="13" letter-spacing="3" fill="#9AA3B2">AVAILABLE FOR FREELANCE  ·  CAIRO, EG</text>
  </g>
  <text class="serif a2" x="60" y="222" font-size="98" fill="#EDE8DD" letter-spacing="-2">Saif Eldeen</text>
  <text class="serif a3" x="60" y="318" font-size="98" font-style="italic" fill="#F5A524" letter-spacing="-2">Mohamed</text>
  <rect class="line" x="64" y="344" width="120" height="2" fill="#F5A524"/>
  <text class="mono a4" x="64" y="384" font-size="17" fill="#9AA3B2">Flutter engineer. Payments, real-time and offline-first apps.</text>
  <text class="mono a5" x="64" y="412" font-size="13" fill="#5B6472" letter-spacing="1">co-founder, BitForge  /  shipping to production since 2023</text>

  <!-- back phone: live tracking -->
  <g transform="translate(985 45) rotate(8)"><g class="f2">
    <rect width="200" height="340" rx="32" fill="url(#ph)" stroke="#fff" stroke-opacity=".12"/>
    <rect x="70" y="12" width="60" height="6" rx="3" fill="#fff" fill-opacity=".1"/>
    <text class="mono" x="24" y="56" font-size="10" letter-spacing="2" fill="#7CF2C9">LIVE TRACKING</text>
    <path id="rt" class="route" d="M30 100 C 90 130, 50 200, 110 232 S 170 270, 165 300" fill="none" stroke="#7CF2C9" stroke-opacity=".7" stroke-width="2"/>
    <circle r="6" fill="#7CF2C9"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion></circle>
    <circle cx="30" cy="100" r="4" fill="#fff" fill-opacity=".5"/>
    <circle cx="165" cy="300" r="4" fill="#F5A524"/>
    <rect x="24" y="76" width="90" height="6" rx="3" fill="#fff" fill-opacity=".12"/>
  </g></g>

  <!-- front phone: seat map -->
  <g transform="translate(800 80) rotate(-6)"><g class="f1">
    <rect width="200" height="340" rx="32" fill="url(#ph)" stroke="#fff" stroke-opacity=".16"/>
    <rect x="70" y="12" width="60" height="6" rx="3" fill="#fff" fill-opacity=".1"/>
    <text class="mono" x="24" y="56" font-size="10" letter-spacing="2" fill="#F5A524">SEAT MAP</text>
    <path d="M30 84 Q100 66 170 84" fill="none" stroke="#F5A524" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <g>
      <circle class="s" cx="40" cy="120" r="7"/><circle class="s" cx="64" cy="120" r="7" style="animation-delay:1.2s"/><circle class="s" cx="88" cy="120" r="7"/><circle class="s" cx="112" cy="120" r="7"/><circle class="s" cx="136" cy="120" r="7" style="animation-delay:2.4s"/><circle class="s" cx="160" cy="120" r="7"/>
      <circle class="s" cx="40" cy="146" r="7"/><circle class="s" cx="64" cy="146" r="7"/><circle class="s" cx="88" cy="146" r="7" style="animation-delay:.6s"/><circle class="s" cx="112" cy="146" r="7" style="animation-delay:.6s"/><circle class="s" cx="136" cy="146" r="7"/><circle class="s" cx="160" cy="146" r="7"/>
      <circle class="s" cx="40" cy="172" r="7" style="animation-delay:3s"/><circle class="s" cx="64" cy="172" r="7"/><circle class="s" cx="88" cy="172" r="7"/><circle class="s" cx="112" cy="172" r="7"/><circle class="s" cx="136" cy="172" r="7" style="animation-delay:1.8s"/><circle class="s" cx="160" cy="172" r="7"/>
      <circle class="s" cx="40" cy="198" r="7"/><circle class="s" cx="64" cy="198" r="7" style="animation-delay:2s"/><circle class="s" cx="88" cy="198" r="7"/><circle class="s" cx="112" cy="198" r="7"/><circle class="s" cx="136" cy="198" r="7"/><circle class="s" cx="160" cy="198" r="7" style="animation-delay:.9s"/>
      <circle class="s" cx="40" cy="224" r="7"/><circle class="s" cx="64" cy="224" r="7"/><circle class="s" cx="88" cy="224" r="7" style="animation-delay:3.4s"/><circle class="s" cx="112" cy="224" r="7"/><circle class="s" cx="136" cy="224" r="7"/><circle class="s" cx="160" cy="224" r="7" style="animation-delay:1.5s"/>
    </g>
    <rect x="24" y="274" width="152" height="40" rx="20" fill="#F5A524"/>
    <text class="mono" x="100" y="298" font-size="12" font-weight="700" text-anchor="middle" fill="#0A0C10" letter-spacing="1">PAY  ·  APPLE PAY</text>
  </g></g>
</g>
<rect x=".5" y=".5" width="1199" height="439" rx="26" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
