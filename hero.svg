<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Saif Eldeen Mohamed, Flutter engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D222D"/><stop offset="1" stop-color="#0F1218"/></linearGradient>
  <linearGradient id="bone" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0">
    <stop offset="0" stop-color="#EDE8DD"/><stop offset=".45" stop-color="#EDE8DD"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EDE8DD"/><stop offset="1" stop-color="#EDE8DD"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-760 0" to="760 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="amb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0">
    <stop offset="0" stop-color="#F5A524"/><stop offset=".45" stop-color="#F5A524"/><stop offset=".5" stop-color="#FFD58A"/><stop offset=".55" stop-color="#F5A524"/><stop offset="1" stop-color="#F5A524"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-760 0" to="760 0" dur="5s" begin="1s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="r"><rect width="1200" height="440" rx="26"/></clipPath>
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes bob2{0%,100%{transform:translateY(-8px)}50%{transform:translateY(8px)}}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,40px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,-50px)}}
  @keyframes dash{to{stroke-dashoffset:-48}}
  @keyframes seat{0%,100%{fill:#fff;fill-opacity:.14}40%,75%{fill:#F5A524;fill-opacity:1}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .a1{animation:rise .9s .1s both ease-out}.a2{animation:rise .9s .3s both ease-out}.a3{animation:rise .9s .5s both ease-out}.a4{animation:rise .9s .7s both ease-out}.a5{animation:rise .9s .9s both ease-out}
  .line{transform-origin:64px 0;animation:grow 1s .6s both ease-out}
  .dot{animation:pulse 2s infinite}
  .f1{animation:bob 6s ease-in-out infinite}.f2{animation:bob2 7s ease-in-out infinite}.f3{animation:bob 5s 1s ease-in-out infinite}.f4{animation:bob2 6s .5s ease-in-out infinite}
  .d1{animation:drift1 14s ease-in-out infinite}.d2{animation:drift2 17s ease-in-out infinite}
  .s{fill:#fff;fill-opacity:.14;animation:seat 4.8s infinite}
  .route{stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
</style>
<g clip-path="url(#r)">
  <rect width="1200" height="440" fill="#0A0C10"/>
  <g filter="url(#blur)">
    <circle class="d1" cx="960" cy="110" r="130" fill="#F5A524" fill-opacity=".34"/>
    <circle class="d2" cx="1120" cy="400" r="120" fill="#7CF2C9" fill-opacity=".20"/>
    <circle class="d1" cx="640" cy="40" r="90" fill="#8B7CFF" fill-opacity=".22"/>
    <circle class="d2" cx="120" cy="440" r="110" fill="#F5A524" fill-opacity=".10"/>
  </g>
  <rect width="1200" height="440" fill="url(#grid)"/>

  <g class="a1">
    <circle class="dot" cx="68" cy="68" r="5" fill="#7CF2C9"/>
    <text class="mono" x="86" y="73" font-size="13" letter-spacing="3" fill="#9AA3B2">AVAILABLE FOR FREELANCE  ·  CAIRO, EG</text>
  </g>
  <text class="serif a2" x="60" y="222" font-size="98" fill="url(#bone)" letter-spacing="-2">Saif Eldeen</text>
  <text class="serif a3" x="60" y="318" font-size="98" font-style="italic" fill="url(#amb)" letter-spacing="-2">Mohamed</text>
  <rect class="line" x="64" y="344" width="120" height="2" fill="#F5A524"/>
  <text class="mono a4" x="64" y="384" font-size="17" fill="#9AA3B2">Flutter engineer. Payments, real-time and offline-first apps.</text>
  <text class="mono a5" x="64" y="412" font-size="13" fill="#5B6472" letter-spacing="1">co-founder, BitForge  /  shipping to production since 2023</text>

  <g transform="translate(985 45) rotate(8)"><g class="f2">
    <rect width="200" height="340" rx="32" fill="url(#ph)" stroke="#fff" stroke-opacity=".12"/>
    <rect x="70" y="12" width="60" height="6" rx="3" fill="#fff" fill-opacity=".1"/>
    <text class="mono" x="24" y="56" font-size="10" letter-spacing="2" fill="#7CF2C9">LIVE TRACKING</text>
    <path id="rt" class="route" d="M30 100 C 90 130, 50 200, 110 232 S 170 270, 165 300" fill="none" stroke="#7CF2C9" stroke-opacity=".7" stroke-width="2"/>
    <circle r="6" fill="#7CF2C9"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion></circle>
    <circle cx="30" cy="100" r="4" fill="#fff" fill-opacity=".5"/><circle cx="165" cy="300" r="4" fill="#F5A524"/>
    <rect x="24" y="76" width="90" height="6" rx="3" fill="#fff" fill-opacity=".12"/>
  </g></g>

  <g transform="translate(800 80) rotate(-6)"><g class="f1">
    <rect width="200" height="340" rx="32" fill="url(#ph)" stroke="#fff" stroke-opacity=".16"/>
    <rect x="70" y="12" width="60" height="6" rx="3" fill="#fff" fill-opacity=".1"/>
    <text class="mono" x="24" y="56" font-size="10" letter-spacing="2" fill="#F5A524">SEAT MAP</text>
    <path d="M30 84 Q100 66 170 84" fill="none" stroke="#F5A524" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <g><circle class="s" cx="40" cy="120" r="7"/><circle class="s" cx="64" cy="120" r="7" style="animation-delay:1.2s"/><circle class="s" cx="88" cy="120" r="7"/><circle class="s" cx="112" cy="120" r="7"/><circle class="s" cx="136" cy="120" r="7" style="animation-delay:2.4s"/><circle class="s" cx="160" cy="120" r="7"/><circle class="s" cx="40" cy="146" r="7"/><circle class="s" cx="64" cy="146" r="7"/><circle class="s" cx="88" cy="146" r="7" style="animation-delay:.6s"/><circle class="s" cx="112" cy="146" r="7" style="animation-delay:.6s"/><circle class="s" cx="136" cy="146" r="7"/><circle class="s" cx="160" cy="146" r="7"/><circle class="s" cx="40" cy="172" r="7" style="animation-delay:3s"/><circle class="s" cx="64" cy="172" r="7"/><circle class="s" cx="88" cy="172" r="7"/><circle class="s" cx="112" cy="172" r="7"/><circle class="s" cx="136" cy="172" r="7" style="animation-delay:1.8s"/><circle class="s" cx="160" cy="172" r="7"/><circle class="s" cx="40" cy="198" r="7"/><circle class="s" cx="64" cy="198" r="7" style="animation-delay:2s"/><circle class="s" cx="88" cy="198" r="7"/><circle class="s" cx="112" cy="198" r="7"/><circle class="s" cx="136" cy="198" r="7"/><circle class="s" cx="160" cy="198" r="7" style="animation-delay:.9s"/><circle class="s" cx="40" cy="224" r="7"/><circle class="s" cx="64" cy="224" r="7"/><circle class="s" cx="88" cy="224" r="7" style="animation-delay:3.4s"/><circle class="s" cx="112" cy="224" r="7"/><circle class="s" cx="136" cy="224" r="7"/><circle class="s" cx="160" cy="224" r="7" style="animation-delay:1.5s"/></g>
    <rect x="24" y="274" width="152" height="40" rx="20" fill="#F5A524"/>
    <text class="mono" x="100" y="298" font-size="12" font-weight="700" text-anchor="middle" fill="#0A0C10" letter-spacing="1">PAY  ·  APPLE PAY</text>
  </g></g>

  <g class="f3"><g transform="translate(700 120)"><rect width="104" height="30" rx="15" fill="#12151C" stroke="#7CF2C9" stroke-opacity=".5"/><circle cx="16" cy="15" r="4" fill="#7CF2C9"/><text class="mono" x="28" y="19" font-size="11" fill="#EDE8DD" letter-spacing="1">QR VALID</text></g></g>
  <g class="f4"><g transform="translate(1010 392)"><rect width="128" height="30" rx="15" fill="#12151C" stroke="#F5A524" stroke-opacity=".5"/><circle cx="16" cy="15" r="4" fill="#F5A524"/><text class="mono" x="28" y="19" font-size="11" fill="#EDE8DD" letter-spacing="1">PAYMOB OK</text></g></g>
  <g class="f1"><g transform="translate(690 340)"><rect width="118" height="30" rx="15" fill="#12151C" stroke="#fff" stroke-opacity=".2"/><circle cx="16" cy="15" r="4" fill="#8B7CFF"/><text class="mono" x="28" y="19" font-size="11" fill="#EDE8DD" letter-spacing="1">WEBSOCKET</text></g></g>
</g>
<rect x=".5" y=".5" width="1199" height="439" rx="26" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>