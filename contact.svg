<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Have something to build? saifmohameddev3@gmail.com" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
    <stop offset="0" stop-color="#F5A524"/><stop offset=".33" stop-color="#8B7CFF"/><stop offset=".66" stop-color="#7CF2C9"/><stop offset="1" stop-color="#F5A524"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="1200 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  <clipPath id="c"><rect width="1200" height="230" rx="26"/></clipPath>
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

  @keyframes arrow{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
  @keyframes halo{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.7);opacity:0}}
  .ar{animation:arrow 1.8s ease-in-out infinite}
  .halo{transform-box:fill-box;transform-origin:center;animation:halo 2.2s infinite}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="230" fill="#0A0C10"/>
  <g filter="url(#b)"><circle cx="1050" cy="115" r="120" fill="#F5A524" fill-opacity=".30"/><circle cx="150" cy="230" r="100" fill="#8B7CFF" fill-opacity=".16"/></g>
  <text class="mono" x="66" y="60" font-size="12" letter-spacing="3" fill="#7CF2C9">OPEN TO FREELANCE AND COLLABORATIONS</text>
  <text class="serif" x="62" y="125" font-size="58" fill="#EDE8DD" letter-spacing="-1">Have something <tspan font-style="italic" fill="#F5A524">to build?</tspan></text>
  <text class="mono" x="66" y="170" font-size="20" fill="#EDE8DD">saifmohameddev3@gmail.com</text>
  <text class="mono" x="66" y="198" font-size="12" letter-spacing="2" fill="#5B6472">CAIRO, EGYPT</text>
  <circle class="halo" cx="1070" cy="115" r="42" fill="none" stroke="#F5A524" stroke-width="2"/>
  <circle cx="1070" cy="115" r="42" fill="#F5A524"/>
  <g class="ar"><path d="M1054 115H1086M1072 100L1087 115L1072 130" fill="none" stroke="#0A0C10" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<rect x="1" y="1" width="1198" height="228" rx="25" fill="none" stroke="url(#bd)" stroke-width="2"/>
</svg>