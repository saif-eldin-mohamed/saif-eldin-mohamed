<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Q_Prime">
<defs>
  <filter id="gb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="cc"><rect width="600" height="340" rx="24"/></clipPath>
  <clipPath id="pc"><rect width="536" height="142" rx="16"/></clipPath>
  
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes dash{to{stroke-dashoffset:-28}}
  @keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2);opacity:0}}
  @keyframes hl{0%,22%{opacity:1}38%,100%{opacity:0}}
  @keyframes swa{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
  @keyframes swb{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes qh{0%{opacity:0}6%,28%{opacity:1}36%,100%{opacity:0}}
  @keyframes print{0%{transform:translateY(-86px)}60%,100%{transform:translateY(0)}}
  @keyframes bub{0%,28%{opacity:0;transform:translateY(10px)}44%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes prog{from{stroke-dashoffset:289}to{stroke-dashoffset:0}}
  .r1{animation:rise .8s .05s both ease-out}.r2{animation:rise .8s .2s both ease-out}.r3{animation:rise .8s .35s both ease-out}.r4{animation:rise .8s .5s both ease-out}
  .bob{animation:bob 4s ease-in-out infinite}
  .dash{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
  .ringa{transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
  .pl{animation:pulse 2s infinite}
</style>
<g clip-path="url(#cc)">
  <rect width="600" height="340" fill="#0A0C10"/>
  <circle cx="540" cy="40" r="95" fill="#C084FC" fill-opacity=".30" filter="url(#gb)"/>
  <circle cx="30" cy="330" r="80" fill="#C084FC" fill-opacity=".10" filter="url(#gb)"/>
  <g class="r1"><g><rect x="32.0" y="24" width="206.2" height="26" rx="13" fill="#C084FC" fill-opacity=".10" stroke="#C084FC" stroke-opacity=".55"/><text class="mono" x="46.0" y="41.5" font-size="11" letter-spacing="1.5" fill="#C084FC">08 / AI QUIZ GENERATOR</text></g><g><rect x="406.5" y="24" width="161.5" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="420.5" cy="37" r="3.5" fill="#9AA3B2"/><text class="mono" x="434.5" y="41.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">FLUTTER + AI APIS</text></g></g>
  <text class="serif r2" x="30" y="104" font-size="42" fill="#EDE8DD" letter-spacing="-1">Q_Prime</text>
  <text class="mono r3" x="32" y="132" font-size="13.5" fill="#9AA3B2">PDF, DOCX and PPTX go in,</text>
  <text class="mono r3" x="32" y="152" font-size="13.5" fill="#9AA3B2">interactive quizzes come out.</text>
  <g transform="translate(32 170)"><g class="r4">
    <rect width="536" height="142" rx="16" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".09"/>
    <g clip-path="url(#pc)"><rect x="22" y="14" width="92" height="114" rx="11" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/>
<rect x="34" y="24" width="34" height="16" rx="4" fill="#C084FC" fill-opacity=".2" stroke="#C084FC" stroke-opacity=".6"/><text class="mono" x="51" y="36" font-size="9" font-weight="700" text-anchor="middle" fill="#C084FC">PDF</text>
<rect x="34" y="54" width="68" height="5" rx="2.5" fill="#fff" fill-opacity=".2"/><rect x="34" y="68" width="58" height="5" rx="2.5" fill="#fff" fill-opacity=".2"/><rect x="34" y="82" width="66" height="5" rx="2.5" fill="#fff" fill-opacity=".2"/><rect x="34" y="96" width="44" height="5" rx="2.5" fill="#fff" fill-opacity=".2"/><rect x="34" y="110" width="60" height="5" rx="2.5" fill="#fff" fill-opacity=".2"/>
