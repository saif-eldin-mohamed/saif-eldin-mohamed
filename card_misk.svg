<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Misk">
<defs>
  <filter id="gb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="cc"><rect width="600" height="340" rx="24"/></clipPath>
  <clipPath id="pc"><rect width="536" height="142" rx="16"/></clipPath>
  
</defs>
<style>
  .mono{font-family:'SF Mono',ui-monospace,Menlo,Consolas,'Courier New',monospace}
  .serif{font-family:Georgia,'Times New Roman',serif}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes dash{to{stroke-dashoffset:-28}}
  @keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2);opacity:0}}
  @keyframes hl{0%,22%{opacity:1}38%,100%{opacity:0}}
  @keyframes swa{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
  @keyframes swb{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes qh{0%{opacity:0}6%,28%{opacity:1}36%,100%{opacity:0}}
  @keyframes print{0%{transform:translateY(-86px)}60%,100%{transform:translateY(0)}}
  @keyframes bub{0%,28%{opacity:0;transform:translateY(10px)}44%,88%{opacity:1;transform:translateY(0)}100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes prog{from{stroke-dashoffset:289}to{stroke-dashoffset:0}}
  .r1{animation:rise .8s .05s both ease-out}.r2{animation:rise .8s .2s both ease-out}.r3{animation:rise .8s .35s both ease-out}.r4{animation:rise .8s .5s both ease-out}
  .bob{animation:bob 4s ease-in-out infinite}
  .dash{stroke-dasharray:7 7;animation:dash 1.1s linear infinite}
  .ringa{transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
  .pl{animation:pulse 2s infinite}
</style>
<g clip-path="url(#cc)">
  <rect width="600" height="340" fill="#0A0C10"/>
  <circle cx="540" cy="40" r="95" fill="#34D399" fill-opacity=".30" filter="url(#gb)"/>
  <circle cx="30" cy="330" r="80" fill="#34D399" fill-opacity=".10" filter="url(#gb)"/>
  <g class="r1"><g><rect x="32.0" y="24" width="206.2" height="26" rx="13" fill="#34D399" fill-opacity=".10" stroke="#34D399" stroke-opacity=".55"/><text class="mono" x="46.0" y="41.5" font-size="11" letter-spacing="1.5" fill="#34D399">07 / ISLAMIC COMPANION</text></g><g><rect x="436.5" y="24" width="131.5" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><circle class="pl" cx="450.5" cy="37" r="3.5" fill="#9AA3B2"/><text class="mono" x="464.5" y="41.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">OFFLINE-FIRST</text></g></g>
  <text class="serif r2" x="30" y="104" font-size="42" fill="#EDE8DD" letter-spacing="-1">Misk</text>
  <text class="mono r3" x="32" y="132" font-size="13.5" fill="#9AA3B2">Quran, Hadith, Azkar, Tasbih and Zakat.</text>
  <text class="mono r3" x="32" y="152" font-size="13.5" fill="#9AA3B2">Everything works without internet.</text>
  <g class="r4" transform="translate(32 170)">
    <rect width="536" height="142" rx="16" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".09"/>
    <g clip-path="url(#pc)"><g transform="translate(96 71) rotate(-90)"><circle r="46" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="9"/>
<circle r="46" fill="none" stroke="#34D399" stroke-width="9" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="289" style="animation:prog 6s ease-in-out infinite alternate"/></g>
<text class="serif" x="96" y="82" font-size="34" text-anchor="middle" fill="#EDE8DD">33</text><text class="mono" x="96" y="98" font-size="8.5" letter-spacing="2" text-anchor="middle" fill="#9AA3B2">TASBIH</text>
<g transform="translate(470 71)"><g style="animation:spin 40s linear infinite"><rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#34D399" stroke-width="1.5"/><rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#34D399" stroke-width="1.5" transform="rotate(45)"/></g><g style="animation:spinr 28s linear infinite"><rect x="-24" y="-24" width="48" height="48" fill="none" stroke="#8B7CFF" stroke-width="1.5"/><rect x="-24" y="-24" width="48" height="48" fill="none" stroke="#8B7CFF" stroke-width="1.5" transform="rotate(45)"/></g><circle r="6" fill="#34D399"/></g>
<g transform="translate(168 18)"><g><rect x="0.0" y="0" width="193.0" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><text class="mono" x="14.0" y="17.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">QURAN / HADITH / AZKAR</text></g><g><rect x="0.0" y="34" width="131.5" height="26" rx="13" fill="#34D399" fill-opacity=".10" stroke="#34D399" stroke-opacity=".55"/><circle class="pl" cx="14" cy="47" r="3.5" fill="#34D399"/><text class="mono" x="28.0" y="51.5" font-size="10" letter-spacing="1.5" fill="#34D399">OFFLINE FIRST</text></g><g><rect x="0.0" y="68" width="148.0" height="26" rx="13" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".16"/><text class="mono" x="14.0" y="85.5" font-size="10" letter-spacing="1.5" fill="#EDE8DD">ZAKAT CALCULATOR</text></g></g></g>
  </g>
</g>
<rect x=".5" y=".5" width="599" height="339" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>